<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réservation confirmée — Exotic Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --creme:#F6F2ED;
  --noir:#171412;
  --brun:#6B4A3A;
  --texte:#4A4139;
  --gris:#6E645C;
  --or:#C9A281;
  --line:#DED3C5;
}
*{box-sizing:border-box;}
body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'DM Sans', system-ui, sans-serif; color:var(--noir); background:var(--creme); font-weight:300; -webkit-font-smoothing:antialiased; padding:26px;}
a{color:inherit;}
.card{max-width:480px; width:100%; text-align:center; background:#fff; border:1px solid var(--line); border-radius:4px; padding:52px 34px;}
.mark{width:56px; height:56px; margin:0 auto 26px; border-radius:999px; background:var(--noir); color:var(--creme); display:flex; align-items:center; justify-content:center; font-size:26px;}
.eyebrow{font-size:13px; letter-spacing:0.26em; color:var(--brun); margin:0 0 16px;}
h1{margin:0 0 18px; font-family:'Instrument Serif', serif; font-weight:400; font-size:clamp(28px,5vw,38px); line-height:1.2;}
p{margin:0 0 14px; font-size:16px; line-height:1.7; color:var(--texte);}
.ref{font-size:13px; color:var(--gris); margin-bottom:30px;}
.btn{display:inline-block; padding:15px 32px; border-radius:999px; background:var(--noir); color:var(--creme); font-size:13px; text-decoration:none; margin-top:6px;}
.btn:hover{background:var(--brun);}
.wa{display:block; margin-top:18px; font-size:13px; color:var(--gris); text-decoration:none;}
.wa:hover{color:var(--brun);}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">✓</div>
    <p class="eyebrow">Exotic Beauty</p>
    <h1>Votre créneau est réservé</h1>
    <p>L'acompte a bien été réglé. Vous recevrez un rappel par SMS la veille de votre rendez-vous.</p>
    <p class="ref" id="bookingRef"></p>
    <a href="/" class="btn">Retour à l'accueil</a>
    <a href="https://wa.me/596770211399" class="wa">une question ? écrire sur whatsapp</a>
  </div>
  <script>
    const id = new URLSearchParams(location.search).get('booking');
    if (id) {
      document.getElementById('bookingRef').textContent = 'Référence de réservation : ' + id;
    }
  </script>
</body>
</html>
